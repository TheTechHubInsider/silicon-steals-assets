  <script>
    (function() {
      var asin = "B0FNQDNGXY";
      var tag = "thetechhubins-20";
      var webUrl = "https://www.amazon.com/dp/B0FNQDNGXY/?tag=thetechhubins-20";
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      // 1. Attempt Native App Scheme
      if (isAndroid) {
        window.location.href = "com.amazon.mobile.shopping.web://amazon.com/dp/" + asin + "/?tag=" + tag;
      } else if (isIOS) {
        window.location.href = "amzn://www.amazon.com/dp/" + asin + "/?tag=" + tag;
      }

      // 2. Guaranteed Universal Fallback (400ms)
      // If app opens, page pauses in background. If in-app browser blocks scheme, user seamlessly lands on Amazon deal page.
      setTimeout(function() {
        window.location.replace(webUrl);
      }, 400);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://www.amazon.com/dp/B0FNQDNGXY/?tag=thetechhubins-20">
