<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Silicon Steals - Smart Router</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function() {
      var tag = "thetechhubins-20";
      var path = window.location.pathname || "";
      var match = path.match(/\/go\/([A-Za-z0-9]{10})/i);
      if (match) {
        var asin = match[1].toUpperCase();
        var webUrl = "https://www.amazon.com/dp/" + asin + "/?tag=" + tag;
        var ua = navigator.userAgent || navigator.vendor || window.opera || "";

        if (/Android/i.test(ua)) {
          var intentUrl = "intent://amazon.com/dp/" + asin + "/?tag=" + tag + "#Intent;scheme=https;package=com.amazon.mShop.android.shopping;S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end;";
          window.location.replace(intentUrl);
        } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
          var appUrl = "amzn://www.amazon.com/dp/" + asin + "/?tag=" + tag;
          window.location.href = appUrl;
          setTimeout(function() {
            window.location.replace(webUrl);
          }, 600);
        } else {
          window.location.replace(webUrl);
        }
        return;
      }
      // Fallback for non-go paths: return to home
      window.location.replace("/");
    })();
  </script>
</head>
<body style="background:#090d16; color:#94a3b8; font-family:sans-serif; text-align:center; padding:60px 20px;">
  <h2>Redirecting...</h2>
  <p><a href="/" style="color:#38bdf8;">Click here to return to Silicon Steals</a></p>
</body>
</html>
