<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Silicon Steals - Smart Router</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function() {
      var tag = "thetechhubins-20";
      var path = window.location.pathname || "";
      var match = path.match(/\/go\/([A-Za-z0-9]{10})/i);
      if (match) {
        var asin = match[1].toUpperCase();
        var webUrl = "https://www.amazon.com/dp/" + asin + "/?tag=" + tag;
        var ua = navigator.userAgent || navigator.vendor || window.opera || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

        if (isAndroid) {
          window.location.href = "com.amazon.mobile.shopping.web://amazon.com/dp/" + asin + "/?tag=" + tag;
        } else if (isIOS) {
          window.location.href = "amzn://www.amazon.com/dp/" + asin + "/?tag=" + tag;
        }

        setTimeout(function() {
          window.location.replace(webUrl);
        }, 400);
        return;
      }
      // Fallback for non-go paths: return to home
      window.location.replace("/");
    })();
  </script>
</head>

  </div>
</body>
</html>
